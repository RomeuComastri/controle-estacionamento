spring.application.name=estacionamento

# Perfil local usado quando nenhum perfil e informado explicitamente.
spring.profiles.default=local

# Credenciais ficam em application-local.properties (ignorado pelo Git).
# Outros ambientes podem fornecer SPRING_DATASOURCE_URL,
# SPRING_DATASOURCE_USERNAME e SPRING_DATASOURCE_PASSWORD.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- Thymeleaf ---
spring.thymeleaf.cache=false

# --- Necessario para os formularios com PUT e DELETE (metodo _method) ---
spring.mvc.hiddenmethod.filter.enabled=true
