<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{template.html}">
<head><title>Não foi possível concluir | Estacionamento</title></head>
<body><div layout:fragment="conteudo" class="page">
    <section class="panel error-card">
        <span class="error-code" th:text="${status}">Erro</span>
        <p class="eyebrow">ESTACIONAMENTO / ATENDIMENTO</p>
        <h1 th:text="${status == 404} ? 'Página não encontrada' : 'Não foi possível concluir'">Não foi possível concluir</h1>
        <p class="page-description" th:text="${status == 404} ? 'O endereço informado não está disponível. Utilize o menu para continuar.' : 'Ocorreu um problema ao processar sua solicitação. Volte à listagem e confira os dados antes de tentar novamente.'"></p>
        <div class="error-actions"><a class="button button-primary" th:href="@{/menus/principal}">Voltar ao início</a><a class="button button-secondary" th:href="@{/clientes/listagem}">Consultar clientes</a><a class="button button-secondary" th:href="@{/veiculos/listagem}">Consultar veículos</a></div>
    </section>
</div></body></html>
