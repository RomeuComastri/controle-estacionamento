<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{template.html}">
    <head>
        <title>
            Cadastro de cliente | Estacionamento
        </title>
    </head>
    <body>
        <div layout:fragment="conteudo" class="page page-clients">
            <a class="back-link" href="/clientes/listagem">
                ← Voltar para clientes
            </a>
            <header class="page-heading">
                <div>
                    <p class="eyebrow">
                        GESTÃO DE CADASTROS
                    </p>
                    <h1>
                        <span th:text="${cliente == null} ? 'Novo cliente' : 'Editar cliente'">
                        </span>
                    </h1>
                    <p class="page-description">
                        Preencha os dados abaixo para manter seu cadastro atualizado.
                    </p>
                </div>
            </header>
            <section class="panel form-panel">
                <div class="panel-heading">
                    <h2>
                        Dados do cliente
                    </h2>
                    <span class="subtle">
                        * Campos obrigatórios
                    </span>
                </div>
                <div class="form-body">
                    <form method="post" th:action="@{'/clientes/formulario'}">
                        <input type="hidden" name="_method" value="put" th:if="${cliente != null}">
                        <input type="hidden" name="idCliente" th:value="${cliente?.idCliente}">
                        <div class="form-grid">
                            <div class="field">
                                <label for="nome">
                                    Nome
                                    <span class="required">
                                        *
                                    </span>
                                </label>
                                <input id="nome" name="nome" th:value="${cliente?.nome}" required>
                            </div>
                            <div class="field">
                                <label for="cpf">
                                    CPF
                                    <span class="required">
                                        *
                                    </span>
                                </label>
                                <input id="cpf" name="cpf" th:value="${cliente?.cpf}" required>
                            </div>
                            <div class="field">
                                <label for="telefone">
                                    Telefone
                                    <span class="optional">
                                        opcional
                                    </span>
                                </label>
                                <input id="telefone" name="telefone" th:value="${cliente?.telefone}">
                            </div>
                        </div>
                        <div class="form-actions">
                            <input class="button button-primary" type="submit" th:value="${cliente == null} ? 'Cadastrar' : 'Salvar alterações'">
                            <a class="button button-secondary" href="/clientes/listagem">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </section>
        </div>
    </body>
</html>
